name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Testes, lint e código estático
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verificar formatação (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Arquivos fora do padrão gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Build (typecheck)
        run: go build ./...

      - name: Código estático (go vet)
        run: go vet ./...

      - name: Testes
        run: go test ./... -race -count=1

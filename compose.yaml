services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: records
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d records"]
      interval: 2s
      timeout: 5s
      retries: 15
    command: ["postgres", "-c", "max_connections=120", "-c", "shared_buffers=256MB"]

  api:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/records?sslmode=disable
      HTTP_ADDR: :8080
      DB_MAX_CONNS: 24
      DB_MIN_CONNS: 4
      MAX_BATCH_SIZE: 50000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  gatling:
    build:
      context: ./gatling
    profiles: ["load"]
    ports:
      - "8090:8090"
    working_dir: /workspace
    volumes:
      - ./gatling:/workspace
    environment:
      BASE_URL: http://api:8080
      HTTP_ADDR: :8090
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
